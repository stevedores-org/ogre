apiVersion: apps/v1
kind: Deployment
metadata:
  name: ogre-svc
  labels:
    app.kubernetes.io/name: ogre-svc
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ogre-svc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ogre-svc
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: ogre-svc
          image: us-central1-docker.pkg.dev/gcp-lornu-ai/lornu/ogre-svc:main
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RUST_LOG
              value: info
            - name: OGRE_LISTEN_ADDR
              value: 0.0.0.0:8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /readiness
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
